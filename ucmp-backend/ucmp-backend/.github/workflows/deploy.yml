name: Deploy Spring Boot Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main # Change to master if your primary branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ucmp-backend
          environment_name: ucmp-backend-env
          version_label: "deploy-${{ github.sha }}"
          region: eu-north-1
          deployment_package: target/ucmp-backend-0.0.1-SNAPSHOT.jar
